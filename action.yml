name: 'Pitest report'
description: 'Publish the pitest report'
inputs:
  name:
    description: Name of the check run
    required: false
    default: Pitest report
  file:
    description: Pitest report file (XML, CSV)
    required: false
    default: '**/pit-reports/mutations.xml'
  summary:
    description: The results are published as part of the workflow summary
    required: false
    default: 'true'
  annotation-types:
    description: Generate annotation for status (ALL, SURVIVED, KILLED). SURVIVED includes mutations without coverage
    required: false
    default: SURVIVED
  output:
    description: Output location of the annotations (checks, workflow)
    required: false
    default: checks
  max-annotations:
    description: Limit the number of annotations that are generated (1 to 50)
    required: false
    default: '10'
  threshold:
    description: Fail if the test strength (0 to 100) is below the threshold
    required: false
    default: '0'
  token:
    description: GitHub Access Token
    required: false
    default: ${{ github.token }}
outputs:
  killed:
    description: Total number of killed mutations (including timed out, memory error, run error and non viable)
  survived:
    description: Total number of survived mutations
  no-coverage:
    description: Total number of mutations without test coverage
runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  icon: 'sliders'
  color: purple