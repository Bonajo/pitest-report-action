# Pushes to main keep main's status and the actions cache up to date; PRs are
# tested through pull_request so the required check also reports on PRs from
# forks, which never trigger a push run in this repository. Limiting push to
# main avoids running the tests twice for every commit on a PR branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-action:
    runs-on: ubuntu-latest
    name: Test pitest report action
    strategy:
      matrix:
        node-version: ["24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Load cached node modules
        id: cached-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: modules-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cached-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Type check sources and tests
        run: npm run build
      - name: Run all tests
        run: npm test
      - name: Check dist is up to date
        run: |
          npm run package
          if [ -n "$(git status --porcelain dist/ | grep -v '\.map$')" ]; then
            echo "dist/ is out of date. Run 'npm run package' and commit the result."
            git diff dist/
            exit 1
          fi